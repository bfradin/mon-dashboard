<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — Marchés : Or · Pétrole · Actions · Taux souverains</title>
<style>
  :root{--bg:#05060a;--panel:#0d1017;--border:#1c2230;--txt:#e8eaf0;--muted:#8b93a7;
    --accent:#6d4aff;--fra:#4f8cff;--deu:#ffd34d;--jpn:#ff6b8a;--gbr:#2dd4a7;--usa:#a68bff;--cmd:#2dd4a7}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;padding-bottom:50px}
  header{position:sticky;top:0;z-index:10;background:rgba(5,6,10,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid #1c2230;padding:18px 28px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  h1{font-size:1.25rem;font-weight:600}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:.78rem;width:100%}
  .filters{margin-left:auto;display:flex;gap:8px}
  .filters button{background:var(--panel);border:1px solid #1c2230;color:var(--muted);
    padding:7px 16px;border-radius:20px;cursor:pointer;font-size:.82rem}
  main{max-width:1280px;margin:0 auto;padding:24px 20px}
  section{margin-bottom:36px}
  h2{font-size:.95rem;color:var(--accent);margin-bottom:14px;text-transform:uppercase;letter-spacing:1.2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid #1c2230;border-radius:14px;padding:16px 18px;
    display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative;
    transition:transform .15s,border-color .15s;text-decoration:none;color:inherit}
  .card:hover{border-color:var(--accent);transform:translateY(-3px)}
  .card .head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-right:18px}
  .card .title{font-size:.88rem;font-weight:600}
  .badge{font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:12px}
  .badge.FRA{background:rgba(79,140,255,.14);color:var(--fra)}
  .badge.DEU{background:rgba(255,211,77,.13);color:var(--deu)}
  .badge.JPN{background:rgba(255,107,138,.14);color:var(--jpn)}
  .badge.GBR{background:rgba(45,212,167,.13);color:var(--gbr)}
  .badge.USA{background:rgba(166,139,255,.15);color:var(--usa)}
  .badge.CMD{background:rgba(45,212,167,.13);color:var(--cmd)}
  .val{font-size:1.55rem;font-weight:700;font-variant-numeric:tabular-nums}
  .meta{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
  .tk{font-size:.66rem;opacity:.7}
  .up{color:#2dd4a7}.down{color:#ff6b6b}.flat{color:var(--muted)}
  svg.wchart{width:100%;height:110px;margin-top:4px}
  .err{color:#ff6b6b;font-size:.75rem}
  footer{text-align:center;color:var(--muted);font-size:.75rem;padding:18px}
</style>
</head>
<body>
<header>
  <h1>💹 Tableau de bord <span>Marchés</span></h1>
  <div class="filters">
    <button id="retryAll">↻ Tout recharger</button>
    <button id="retryFail">↻ Retenter les échecs</button>
  </div>
  <div class="sub" id="status">Chargement des cours (sources : Yahoo Finance + FRED via ton proxy Netlify)…</div>
</header>
<main id="main"></main>
<footer>Cliquez sur une carte pour ouvrir la source · taux souverains : source FRED (Fed américaine), valeurs mensuelles.</footer>

<script>
"use strict";

/* ========== 1. CONFIGURATION DES INDICATEURS ========== */
const GROUPS = [
  { name: "🥇 Or & 🛢️ Pétrole", items: [
    { label: "Once d'or (XAU)",     ticker: "GC=F", badge: "CMD", d: 2, suf: " $" },
    { label: "Brent (Mer du Nord)", ticker: "BZ=F", badge: "CMD", d: 2, suf: " $" },
    { label: "WTI (Texas)",         ticker: "CL=F", badge: "CMD", d: 2, suf: " $" }
  ]},
  { name: "📞 Actions", items: [
    { label: "Orange S.A. (Euronext Paris)", ticker: "ORA.PA", badge: "CMD", d: 2, suf: " €" }
  ]},
  { name: "🏦 Taux souverains 2 ans (%)", items: [
    { label: "États-Unis — 2 ans", ticker: "FRED:DGS2", badge: "USA", d: 2, suf: " %" }
  ]},
  { name: "🏦 Taux souverains 10 ans (%) — dernières valeurs mensuelles", items: [
    { label: "France — 10 ans (OAT)",       ticker: "FRED:IRLTLT01FRM156N", badge: "FRA", d: 2, suf: " %" },
    { label: "Allemagne — 10 ans (Bund)",   ticker: "FRED:IRLTLT01DEM156N", badge: "DEU", d: 2, suf: " %" },
    { label: "Japon — 10 ans (JGB)",        ticker: "FRED:IRLTLT01JPM156N", badge: "JPN", d: 2, suf: " %" },
    { label: "Royaume-Uni — 10 ans (Gilt)", ticker: "FRED:IRLTLT01GBM156N", badge: "GBR", d: 2, suf: " %" },
    { label: "États-Unis — 10 ans (Treas.)", ticker: "^TNX", badge: "USA", d: 2, suf: " %" }
  ]}
];

/* ========== 2. RÉSEAU : ton proxy Netlify en priorité, relais publics en repli ========== */
const RELAIS = [
  /* Ton proxy Netlify (netlify/functions/yahoo.js) */
  function (ticker) { return "/.netlify/functions/yahoo?ticker=" + encodeURIComponent(ticker); },
  /* Replis publics (Yahoo uniquement — utile pour or, pétrole, actions) */
  function (ticker) {
    return "https://corsproxy.io/?url=" + encodeURIComponent(
      "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(ticker) + "?range=5d&interval=1d");
  },
  function (ticker) {
    return "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(
      "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(ticker) + "?range=5d&interval=1d");
  }
];

function fetchTimeout(url, ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || 25000);
  return fetch(url, { signal: ctl.signal }).finally(() => clearTimeout(timer));
}

function yahooRows(js) {
  const res = js && js.chart && js.chart.result && js.chart.result[0];
  if (!res) throw new Error("réponse inattendue");
  const ts = res.timestamp || [];
  const cl = (res.indicators && res.indicators.quote[0].close) || [];
  const rows = [];
  for (let i = 0; i < ts.length; i++) {
    if (cl[i] != null && !isNaN(cl[i])) rows.push({ t: ts[i] * 1000, value: +cl[i] });
  }
  if (!rows.length) throw new Error("aucune donnée (ticker ?)");
  return rows;
}

let relaisPrefere = 0;
async function yahooSeries(ticker) {
  let lastErr = null;
  for (let tour = 0; tour < 2; tour++) {
    for (let i = 0; i < RELAIS.length; i++) {
      const idx = (i + relaisPrefere) % RELAIS.length;
      try {
        const resp = await fetchTimeout(RELAIS[idx](ticker), 25000);
        if (!resp.ok) { lastErr = new Error("HTTP " + resp.status); continue; }
        const js = await resp.json();
        const rows = yahooRows(js);
        relaisPrefere = idx;
        return rows;
      } catch (e) { lastErr = e; }
    }
    await new Promise(res => setTimeout(res, 1500));
  }
  throw lastErr || new Error("tous les relais ont échoué");
}

/* ========== 3. AIDES DE RENDU ========== */
function zoneColor(badge) {
  const s = getComputedStyle(document.documentElement);
  const v = badge === "FRA" ? "--fra" : badge === "DEU" ? "--deu" :
            badge === "JPN" ? "--jpn" : badge === "GBR" ? "--gbr" :
            badge === "USA" ? "--usa" : "--cmd";
  return s.getPropertyValue(v).trim();
}
function fmtVar(debut, fin) {
  if (!debut) return "";
  const p = (fin - debut) / Math.abs(debut) * 100;
  const cls = p > 0.05 ? "up" : p < -0.05 ? "down" : "flat";
  const fleche = p > 0.05 ? "▲" : p < -0.05 ? "▼" : "▬";
  return '<span class="' + cls + '">' + fleche + " " + Math.abs(p).toFixed(2) + " %</span>";
}
function weeklyChart(values, color) {
  const w = 300, h = 100, p = 4, n = values.length;
  const mn = Math.min(...values), mx = Math.max(...values), rg = (mx - mn) || 1;
  const pts = values.map(function (v, i) {
    return [(p + i * (w - 2 * p) / Math.max(n - 1, 1)).toFixed(1),
            (h - p - (v - mn) / rg * (h - 2 * p)).toFixed(1)];
  });
  const ligne = pts.map(pt => pt.join(",")).join(" ");
  const dernier = pts[pts.length - 1];
  return '<svg class="wchart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">'
    + '<polygon points="' + p + ',' + h + ' ' + ligne + ' ' + (w - p) + ',' + h + '" fill="' + color + '" opacity=".10"/>'
    + '<polyline points="' + ligne + '" fill="none" stroke="' + color + '" stroke-width="1.8" stroke-linejoin="round"/>'
    + '<circle cx="' + dernier[0] + '" cy="' + dernier[1] + '" r="3" fill="' + color + '"/></svg>';
}
/* Lien source : FRED pour les séries FRED:, Yahoo sinon */
function sourceUrl(ticker) {
  return ticker.startsWith("FRED:")
    ? "https://fred.stlouisfed.org/series/" + encodeURIComponent(ticker.slice(5))
    : "https://finance.yahoo.com/quote/" + encodeURIComponent(ticker);
}

/* ========== 4. COMPTEUR D'ÉTAT ========== */
const entries = [];
function renderStatus() {
  const total = entries.length;
  const ok = entries.filter(e => e.charge && e.ok).length;
  const ko = entries.filter(e => e.charge && !e.ok).length;
  document.getElementById("status").textContent =
    ok + "/" + total + " cours chargés" +
    (ko ? " (" + ko + " indisponible" + (ko > 1 ? "s" : "") + ")" : "") +
    ((ok + ko) === total ? " — dernière mise à jour : " + new Date().toLocaleTimeString("fr-FR") : " …");
}

/* ========== 5. CHARGEMENT D'UNE CARTE ========== */
async function charger(entry) {
  const card = entry.card, item = entry.item;
  card.querySelector(".val").textContent = "…";
  card.querySelector(".dl").textContent = "";
  try {
    const rows = await yahooSeries(item.ticker);
    const dernier = rows[rows.length - 1].value;
    const premier = rows[0].value;
    card.querySelector(".val").textContent =
      dernier.toLocaleString("fr-FR", { minimumFractionDigits: item.d, maximumFractionDigits: item.d }) + (item.suf || "");
    card.querySelector(".dl").innerHTML = fmtVar(premier, dernier);
    card.querySelector(".sp").innerHTML = weeklyChart(rows.map(r => r.value), zoneColor(item.badge));
    card.querySelector(".wk").textContent = new Date(rows[rows.length - 1].t).toLocaleDateString("fr-FR");
    entry.ok = true;
  } catch (e) {
    card.querySelector(".val").innerHTML = '<span class="err">Cours momentanément indisponible</span>';
    card.querySelector(".dl").textContent = e && e.message ? "motif : " + e.message : "";
    entry.ok = false;
  }
  entry.charge = true;
  renderStatus();
}

/* ========== 6. CONSTRUCTION DE LA PAGE ========== */
(function build() {
  const main = document.getElementById("main");
  let index = 0;
  GROUPS.forEach(function (g) {
    const section = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.textContent = g.name;
    section.appendChild(h2);
    const grille = document.createElement("div");
    grille.className = "grid";
    section.appendChild(grille);
    main.appendChild(section);
    g.items.forEach(function (item) {
      const card = document.createElement("a");
      card.className = "card";
      card.href = sourceUrl(item.ticker);
      card.target = "_blank";
      card.rel = "noopener";
      card.title = "Ouvrir la source (" + item.ticker + ")";
      card.innerHTML =
        '<div class="head"><div class="title">' + item.label + '</div>'
        + '<span class="badge ' + item.badge + '">' + (item.badge === "CMD" ? "Marché" : item.badge) + '</span></div>'
        + '<div class="val">…</div>'
        + '<div class="meta"><span class="tk">' + item.ticker + '</span>'
        + '<span class="wk"></span><span class="dl"></span></div>'
        + '<div class="sp"></div>';
      grille.appendChild(card);
      const entry = { card: card, item: item, charge: false, ok: false };
      entries.push(entry);
      setTimeout(() => charger(entry), index * 300);
      index++;
    });
  });
})();

/* ========== 7. BOUTONS ========== */
document.getElementById("retryAll").addEventListener("click", () => location.reload());
document.getElementById("retryFail").addEventListener("click", () => {
  entries.filter(e => e.charge && !e.ok).forEach((entry, i) => {
    setTimeout(() => charger(entry), i * 300);
  });
});
</script>
</body>
</html>
